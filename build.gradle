plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.horizon'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
        '--enable-preview'
    ])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('-enable-preview', true)
    options.addStringOption('source', '21')
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('cargoBuild', Exec) {
    description = 'Compiles native Rust core library via Cargo'
    workingDir = rootDir

    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'cargo', 'build', '--release'
    } else {
        commandLine 'cargo', 'build', '--release'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'horizon-core',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'TheHawk09 / DiamTek',
            'Built-By': 'TheHawk09 / DiamTek',
            'Description': 'Low-level native runtime foundation, SIMD vectorization, off-heap ring buffers, and Panama FFM bridge for the Horizon ecosystem.'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'horizon-core'
                description = 'Low-level native runtime foundation, SIMD vectorization, off-heap ring buffers, and Panama FFM bridge for the Horizon ecosystem.'
                developers {
                    developer {
                        id = 'TheHawk09'
                        name = 'TheHawk09 / DiamTek'
                        email = 'salexey09@gmail.com'
                    }
                }
            }
        }
    }
}

test {
    dependsOn cargoBuild
    useJUnitPlatform()
    jvmArgs(['--enable-preview'])
    systemProperty 'horizon.native.path', file("target/release/${System.mapLibraryName('horizon_core_native')}").absolutePath
}