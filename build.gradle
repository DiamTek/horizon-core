plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.horizon'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    java21 {
        java {
            srcDirs = ['src/main/java21']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.java21.output
        runtimeClasspath += sourceSets.java21.output
    }
}

configurations {
    java21Implementation.extendsFrom implementation
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileJava21Java', JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['--enable-preview'])
}

tasks.named('compileJava', JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('compileJava21', JavaCompile) {
    description = 'Compiles Java 21 Multi-Release FFM sources'
    source = sourceSets.java21.java
    classpath = sourceSets.java21.compileClasspath
    destinationDirectory = file("$buildDir/classes/java/java21")
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['--enable-preview'])
}

tasks.named('compileTestJava', JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['--enable-preview'])
    dependsOn tasks.named('compileJava21')
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('cargoBuild', Exec) {
    description = 'Compiles native Rust core library via Cargo'
    workingDir = rootDir

    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'cargo', 'build', '--release'
    } else {
        commandLine 'cargo', 'build', '--release'
    }
}

jar {
    if (!project.hasProperty('skipCargo')) {
        dependsOn cargoBuild
    }
    dependsOn tasks.named('compileJava21')
    into('META-INF/versions/21') {
        from sourceSets.java21.output
    }
    def arch = (System.getProperty("os.arch").toLowerCase().contains("aarch64") ||
                System.getProperty("os.arch").toLowerCase().contains("arm64")) ? "arm64" : "x64"
    into("natives/${arch}") {
        from("${rootDir}/target/release") {
            include "*.dll", "*.so", "*.dylib"
        }
    }
    manifest {
        attributes(
            'Multi-Release': 'true',
            'Implementation-Title': 'horizon-core',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'TheHawk09 / DiamTek',
            'Built-By': 'TheHawk09 / DiamTek',
            'Description': 'Multi-Release JAR runtime foundation (Java 17 baseline + Java 21 Panama FFM downcalls).'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'horizon-core'
                description = 'Multi-Release JAR runtime foundation (Java 17 baseline + Java 21 Panama FFM downcalls).'
                developers {
                    developer {
                        id = 'TheHawk09'
                        name = 'TheHawk09 / DiamTek'
                        email = 'salexey09@gmail.com'
                    }
                }
            }
        }
    }
}

test {
    dependsOn cargoBuild
    dependsOn tasks.named('compileJava21')
    useJUnitPlatform()
    jvmArgs(['--enable-preview'])
    systemProperty 'horizon.native.path', file("target/release/${System.mapLibraryName('horizon_core_native')}").absolutePath
}