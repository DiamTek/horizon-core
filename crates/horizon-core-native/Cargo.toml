[package]
name = "horizon-core-native"
version = "0.1.0"
edition = "2021"
authors = ["TheHawk09 / DiamTek <salexey09@gmail.com>"]
license = "LGPL-3.0-only"
description = "Low-level native engine core: SIMD AST evaluation, off-heap arena allocation, Rayon scheduling, and Panama FFM C-ABI bindings."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bumpalo = { version = "3.16", features = ["collections"] }
rayon = "1.10"
bytemuck = { version = "1.19", features = ["derive"] }
log = "0.4"
num_cpus = "1.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"